<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新商品発売スケジュール</title>
<style>
:root{--red:#dc4852;--yellow:#f4c13a;--teal:#36afbc;--green:#51ac41;--blue:#409edc;--ink:#1f2d3d;--sub:#6b7785;--line:#dde3ea;--bg:#ebf0f6}
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;background:var(--bg);color:var(--ink)}
header{background:white;position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--red) 0 20%,var(--yellow) 20% 40%,var(--teal) 40% 60%,var(--green) 60% 80%,var(--blue) 80% 100%)}
.head-inner{max-width:1500px;margin:0 auto;padding:16px 20px 21px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{height:40px;display:block}
.divider{width:1px;height:40px;background:var(--line)}
h1{margin:0;font-size:22px}
.sub{margin:2px 0 0;font-size:13px;color:var(--sub)}
.back{margin-left:auto;font-size:14px;color:var(--ink);text-decoration:none;border:1px solid var(--line);padding:8px 14px;border-radius:8px;background:white}
main{max-width:1500px;margin:18px auto;padding:0 20px}
.bar{background:white;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.bar label{font-size:12px;color:var(--sub);display:flex;flex-direction:column;gap:3px}
.bar input,.bar select{padding:8px 9px;border:1px solid #c5ced8;border-radius:7px;font-size:14px;background:white;min-width:0}
.bar .grow{flex:1;min-width:160px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
button{font:inherit;font-size:14px;font-weight:600;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:white;color:var(--ink);cursor:pointer}
button:hover{background:#f4f7fa}
button.primary{background:var(--ink);color:white;border-color:var(--ink)}
button.primary:hover{background:#2c3e54}
button.on{background:var(--yellow);border-color:#d9a41c}
button:disabled{opacity:.5;cursor:wait}
.info{background:white;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13px;line-height:1.7;color:#444}
.info summary{cursor:pointer;font-weight:600}
.info ul{margin:6px 0 0;padding-left:20px}
.stat{font-size:13px;color:var(--sub);margin:0 2px 8px}
.wrap{background:white;border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:calc(100vh - 230px);min-height:300px}
table{border-collapse:collapse;width:100%;min-width:1100px;font-size:13px}
th{position:sticky;top:0;z-index:2;background:#f4f7fa;text-align:left;padding:8px 8px;border-bottom:2px solid var(--line);white-space:nowrap;font-size:12px}
td{padding:6px 8px;border-bottom:1px solid #eef1f5;vertical-align:top;line-height:1.5}
tr.month td{background:var(--ink);color:white;font-weight:700;font-size:15px;padding:8px 10px;position:sticky;top:34px;z-index:1}
tr.edited td:first-child{box-shadow:inset 4px 0 0 var(--yellow)}
td:nth-child(2){min-width:120px}
td.date{white-space:nowrap;font-weight:600}
td.price{white-space:nowrap;text-align:right}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600;background:#e8eef5;color:#33475b;white-space:nowrap}
td.conf{text-align:center}
.c-◎{color:#2f8a1f;font-weight:700}.c-○{color:#2a78b4;font-weight:700}.c-△{color:#c2410c;font-weight:700}
.corp{display:inline-block;background:var(--red);color:white;border-radius:5px;padding:1px 7px;font-size:11px;font-weight:700;white-space:nowrap}
.lim{display:inline-block;background:#fff3d6;color:#8a5a00;border-radius:5px;padding:1px 7px;font-size:11px;font-weight:600}
.note{color:#555;font-size:12px}
.note a{color:var(--blue);text-decoration:none;white-space:nowrap}
td input,td select{width:100%;padding:5px 6px;border:1px solid #c5ced8;border-radius:5px;font:inherit;font-size:12.5px;background:white;min-width:0}
td .row2{display:flex;gap:4px;margin-top:3px}
td button.del{padding:3px 8px;font-size:12px;color:var(--red)}
.empty{padding:40px;text-align:center;color:var(--sub)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:white;padding:13px 20px;border-radius:8px;font-size:14px;display:none;max-width:90%;z-index:50}
#pdfStage{position:fixed;left:-20000px;top:0;width:1123px}
.page{width:1123px;height:794px;padding:26px 28px;background:white;position:relative;overflow:hidden;color:#1f2d3d;font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif}
.page h2{margin:0 0 2px;font-size:20px}
.page .meta{font-size:11px;color:#6b7785;margin-bottom:8px}
.page table{min-width:0;width:100%;table-layout:fixed;font-size:10.5px}
.page th{position:static;font-size:10px;padding:4px 5px}
.page td{padding:3px 5px;line-height:1.35;word-break:break-all}
.page tr.month td{position:static;font-size:12px;padding:4px 8px}
.page .pn{position:absolute;right:28px;bottom:12px;font-size:10px;color:#6b7785}
@media(max-width:800px){
  .head-inner{padding:12px 14px 17px;gap:10px}.logo{height:28px}.divider{height:28px}h1{font-size:17px}.sub{display:none}
  .back{margin-left:0;padding:6px 10px;font-size:13px}
  main{padding:0 10px;margin:12px auto}
  .bar{padding:10px;gap:8px}.bar label{width:calc(50% - 4px)}.bar label.grow{width:100%}.bar select,.bar input{width:100%;font-size:16px}
  .btns{margin-left:0;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:6px}.btns button{padding:11px 8px;font-size:14px}#bPdf{grid-column:1/-1;font-size:15px}
  #bPrint{display:none}
  .wrap{max-height:none;overflow:visible;border:0;background:transparent}
  table{min-width:0;display:block}thead{display:none}tbody{display:block}
  tr.month{display:block}tr.month td{display:block;position:sticky;top:0;border-radius:8px;margin:12px 0 6px}
  tr.vr{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;background:white;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
  tr.vr td{display:block;border:0;padding:0}
  tr.vr td.date{order:1;flex:1;font-size:13px;color:var(--blue)}
  tr.vr td.price{order:2;font-weight:700}
  tr.vr td.name{order:3;width:100%;font-size:15px;font-weight:600;line-height:1.45;margin:2px 0}
  tr.vr td.cat{order:4}
  tr.vr td.maker,tr.vr td.brand{order:5;font-size:12px;color:var(--sub)}
  tr.vr td.conf{order:6;margin-left:auto;font-size:13px}
  tr.vr td.maker:empty,tr.vr td.brand:empty{display:none}
  tr.vr td.note{order:7;width:100%;margin-top:4px}tr.vr td.note:empty{display:none}
  tr.vr.edited{box-shadow:inset 4px 0 0 var(--yellow)}
  tr.er{display:block;background:white;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
  tr.er td{display:block;border:0;padding:4px 0}
  tr.er td::before{content:attr(data-label);display:block;font-size:11px;color:var(--sub);margin-bottom:2px}
  td input,td select{font-size:16px;padding:9px}
  td:nth-child(2){min-width:0}
  .empty{background:white;border-radius:10px}
  .toast{bottom:16px}
}
@media print{body{background:white}header,.bar,.info,.stat,.toast{display:none}main{margin:0;padding:0;max-width:none}.wrap{border:0;max-height:none;overflow:visible}table{min-width:0;font-size:10px}th,tr.month td{position:static}td button,td.del{display:none}@page{size:A4 landscape;margin:10mm}}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const LS_KEY = 'hatsubaiCal_v1';
const CATS = ['文具','TV玩具','玩具','電子玩具','ドール','プラモ・フィギュア','ミニカー','ゲーム','ゲーム機','TCG','TCG/カード','アーケード','キャラくじ','ファンシー','VTuber・YouTuber','カプセルトイ','食玩','雑貨','書籍'];
const PERIODS = ['上旬','中旬','下旬','未定'];
const FIELDS = ['date','period','ym','maker','cat','brand','name','price','limit','conf','note'];
const WD = ['日','月','火','水','木','金','土'];
let published = {updated:'', notes:[], rows:[]};
let local = loadLocal();
let editMode = false;

function loadLocal(){
  try{ const s = JSON.parse(localStorage.getItem(LS_KEY)); if(s && s.edits) return s; }catch(e){}
  return {edits:{}, added:[], deleted:[]};
}
function saveLocal(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(local)); }catch(e){ toast('ブラウザに保存できませんでした（画面を閉じると編集は消えます）'); }
}
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){ const t=$('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>t.style.display='none',3500); }

function allRows(){
  const del = new Set(local.deleted);
  const rows = published.rows.filter(r=>!del.has(r.id)).map(r=>local.edits[r.id] ? {...r, ...local.edits[r.id], _edited:true} : r);
  return rows.concat(local.added.map(r=>({...r,_edited:true,_added:true})));
}
function updateRow(id, field, value){
  const add = local.added.find(r=>r.id===id);
  if(add){ add[field]=value; if(field==='date' && value){ add.ym=value.slice(0,7); add.period=''; } }
  else{
    const e = local.edits[id] = local.edits[id] || {};
    e[field]=value;
    if(field==='date' && value){ e.ym=value.slice(0,7); e.period=''; }
    if(field==='period' && value){ e.date=''; }
  }
  saveLocal();
}
function sortKey(r){
  const ym = r.ym || (r.date||'').slice(0,7) || '9999-99';
  const pi = r.date ? 9 : Math.max(0, PERIODS.indexOf(r.period));
  return ym + '|' + pi + '|' + (r.date||'') + '|' + (CATS.indexOf(r.cat)+100) + '|' + (r.name||'');
}
function fmtDate(r){
  if(r.date){ const d=new Date(r.date+'T00:00:00'); return `${d.getMonth()+1}月${d.getDate()}日(${WD[d.getDay()]})`; }
  const m = r.ym ? Number(r.ym.slice(5,7)) : '';
  return (m ? m+'月' : '') + (r.period || '未定');
}
function monthLabel(ym){ return ym ? `【${ym.slice(0,4)}年${ym.slice(5,7)}月】` : '【時期未定】'; }

function filtered(){
  const q = $('q').value.trim().toLowerCase();
  const fm=$('fMonth').value, fc=$('fCat').value, fb=$('fBrand').value, fcf=$('fConf').value, fl=$('fLimit').value;
  return allRows().filter(r=>{
    const ym = r.ym || (r.date||'').slice(0,7);
    if(fm && ym!==fm) return false;
    if(fc && r.cat!==fc) return false;
    if(fb && r.brand!==fb) return false;
    if(fcf && r.conf!==fcf) return false;
    if(fl==='corp' && !/法人/.test(r.limit||'')) return false;
    if(fl==='any' && !r.limit) return false;
    if(q && !(`${r.name} ${r.brand} ${r.maker} ${r.cat} ${r.note}`.toLowerCase().includes(q))) return false;
    return true;
  }).sort((a,b)=> sortKey(a)<sortKey(b)?-1:1);
}
function limitHtml(l){ if(!l) return ''; return /法人/.test(l) ? `<span class="corp">🏢 ${esc(l)}</span>` : `<span class="lim">${esc(l)}</span>`; }

function viewRow(r){
  const src = r.src ? ` <a href="${esc(r.src)}" target="_blank" rel="noopener">出典↗</a>` : '';
  return `<tr class="vr ${r._edited?'edited':''}"><td class="date">${esc(fmtDate(r))}</td><td class="maker">${esc(r.maker)}</td><td class="cat"><span class="chip">${esc(r.cat)}</span></td><td class="brand">${esc(r.brand)}</td><td class="name">${esc(r.name)} ${limitHtml(r.limit)}</td><td class="price">${esc(r.price)}</td><td class="conf c-${esc(r.conf)}">${esc(r.conf)}</td><td class="note">${esc(r.note)}${src}</td></tr>`;
}
function inp(r, f, extra=''){ return `<input data-id="${esc(r.id)}" data-f="${f}" value="${esc(r[f])}" ${extra}>`; }
function sel(r, f, opts, blank){
  return `<select data-id="${esc(r.id)}" data-f="${f}">${blank?'<option value=""></option>':''}${opts.map(o=>`<option ${r[f]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
}
function editRow(r){
  const L=(l,c)=>`<td data-label="${l}">${c}</td>`;
  return `<tr class="er ${r._edited?'edited':''}">${L('発売日',`<input type="date" data-id="${esc(r.id)}" data-f="date" value="${esc(r.date)}"><div class="row2">${sel(r,'period',PERIODS,true)}<input type="month" data-id="${esc(r.id)}" data-f="ym" value="${esc(r.ym)}"></div>`)}
  ${L('メーカー',inp(r,'maker'))}${L('カテゴリ',`<select data-id="${esc(r.id)}" data-f="cat">${[...new Set([...CATS, r.cat])].map(o=>`<option ${r.cat===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`)}
  ${L('ブランド',inp(r,'brand'))}${L('商品名・限定',`${inp(r,'name')}<div class="row2">${inp(r,'limit','placeholder="限定（例: 法人限定）"')}</div>`)}
  ${L('価格(税込)',inp(r,'price'))}${L('確度',sel(r,'conf',['◎','○','△']))}
  ${L('備考',`${inp(r,'note')}<div class="row2"><button class="del" data-del="${esc(r.id)}">この行を削除</button></div>`)}</tr>`;
}
function render(){
  const rows = filtered();
  let html = `<thead><tr><th>発売日</th><th>メーカー</th><th>カテゴリ</th><th>ブランド</th><th>商品名</th><th>価格(税込)</th><th>確度</th><th>備考・出典</th></tr></thead><tbody>`;
  let cur = null;
  for(const r of rows){
    const ym = r.ym || (r.date||'').slice(0,7);
    if(ym!==cur){ cur=ym; html += `<tr class="month"><td colspan="8">### ${monthLabel(ym)}</td></tr>`.replace('### ',''); }
    html += editMode ? editRow(r) : viewRow(r);
  }
  html += '</tbody>';
  $('tbl').innerHTML = rows.length ? html : '<tbody><tr><td class="empty">該当する商品がありません</td></tr></tbody>';
  const corp = rows.filter(r=>/法人/.test(r.limit||'')).length;
  $('stat').textContent = `${rows.length}件を表示（全${allRows().length}件）／ データ更新: ${published.updated||'-'}／ 法人限定: ${corp}件` + (local.added.length||Object.keys(local.edits).length||local.deleted.length ? ' ／ この端末で編集中の変更あり' : '');
}
function fillFilters(){
  const rows = allRows();
  const months = [...new Set(rows.map(r=>r.ym || (r.date||'').slice(0,7)).filter(Boolean))].sort();
  const keep = {m:$('fMonth').value,c:$('fCat').value,b:$('fBrand').value};
  $('fMonth').innerHTML = '<option value="">すべて</option>' + months.map(m=>`<option value="${m}">${m.slice(0,4)}年${m.slice(5)}月</option>`).join('');
  const cats = [...new Set(rows.map(r=>r.cat))].sort((a,b)=>CATS.indexOf(a)-CATS.indexOf(b));
  $('fCat').innerHTML = '<option value="">すべて</option>' + cats.map(c=>`<option>${esc(c)}</option>`).join('');
  const brands = [...new Set(rows.map(r=>r.brand).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
  $('fBrand').innerHTML = '<option value="">すべて</option>' + brands.map(c=>`<option>${esc(c)}</option>`).join('');
  $('fMonth').value=keep.m; $('fCat').value=keep.c; $('fBrand').value=keep.b;
}

/* ---------- 編集 ---------- */
$('tbl').addEventListener('change', e=>{
  const t=e.target; if(!t.dataset.f) return;
  updateRow(t.dataset.id, t.dataset.f, t.value);
  if(t.dataset.f==='date' || t.dataset.f==='period' || t.dataset.f==='ym'){ fillFilters(); render(); }
  else { t.closest('tr').classList.add('edited'); $('stat').textContent = $('stat').textContent.replace(/ ／ この端末.*$/,'') + ' ／ この端末で編集中の変更あり'; }
});
$('tbl').addEventListener('click', e=>{
  const id = e.target.dataset && e.target.dataset.del; if(!id) return;
  if(!confirm('この行を削除しますか？（「編集を全て戻す」で復元できます）')) return;
  const ai = local.added.findIndex(r=>r.id===id);
  if(ai>=0) local.added.splice(ai,1); else local.deleted.push(id);
  saveLocal(); fillFilters(); render();
});
$('bEdit').onclick = ()=>{
  editMode = !editMode;
  $('bEdit').classList.toggle('on', editMode);
  $('bEdit').textContent = editMode ? '✅ 編集を終える' : '✏️ 編集モード';
  $('bAdd').style.display = editMode ? '' : 'none';
  render();
};
$('bAdd').onclick = ()=>{
  const d0 = new Date(); const ym = $('fMonth').value || (d0.getFullYear()+'-'+String(d0.getMonth()+1).padStart(2,'0'));
  const id = 'u-' + Date.now().toString(36);
  local.added.unshift({id, date:'', period:'未定', ym, maker:'', cat:$('fCat').value||'玩具', brand:'', name:'（新しい商品）', price:'', limit:'', conf:'○', note:'', src:''});
  saveLocal(); $('q').value=''; fillFilters(); render(); toast('行を追加しました。商品名などを入力してください');
};
$('bReset').onclick = ()=>{
  if(!confirm('この端末での編集・追加・削除をすべて元に戻します。よろしいですか？')) return;
  local = {edits:{}, added:[], deleted:[]}; saveLocal(); fillFilters(); render(); toast('元に戻しました');
};
['q','fMonth','fCat','fBrand','fConf','fLimit'].forEach(id=>$(id).addEventListener('input', render));

/* ---------- 書き出し/読み込み ---------- */
function download(name, blob){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }
const stamp = () => { const d=new Date(); return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'); };
function cleanRow(r){ const o={id:r.id}; [...FIELDS,'src'].forEach(f=>o[f]=r[f]??''); return o; }
$('bJson').onclick = ()=>{
  const out = {updated:published.updated, notes:published.notes, rows: allRows().map(cleanRow)};
  download(`hatsubai_${stamp()}.json`, new Blob([JSON.stringify(out,null,1)],{type:'application/json'}));
};
$('bCsv').onclick = ()=>{
  const head=['発売日','メーカー','カテゴリ','ブランド','商品名','価格(税込)','限定','確度','備考','出典'];
  const q = v => '"'+String(v??'').replace(/"/g,'""')+'"';
  const lines=[head.map(q).join(',')].concat(filtered().map(r=>[fmtDateFull(r),r.maker,r.cat,r.brand,r.name,r.price,r.limit,r.conf,r.note,r.src].map(q).join(',')));
  download(`hatsubai_${stamp()}.csv`, new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv'}));
};
function fmtDateFull(r){ return r.date ? r.date.replace(/-/g,'/') : fmtDate(r); }
$('bImport').onclick = ()=>$('file').click();
$('file').onchange = async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{
    const data = JSON.parse(await f.text());
    const rows = Array.isArray(data) ? data : data.rows;
    if(!Array.isArray(rows) || !rows.every(r=>r && r.id && r.name!==undefined)) throw new Error('形式が違います');
    if(!confirm(`${rows.length}件を読み込みます。この端末の編集内容は読み込んだ内容で置き換わります。よろしいですか？`)) return;
    const pub = new Map(published.rows.map(r=>[r.id,r]));
    const seen = new Set(); local = {edits:{}, added:[], deleted:[]};
    for(const r0 of rows){
      const r = cleanRow(r0); seen.add(r.id);
      const p = pub.get(r.id);
      if(!p){ local.added.push(r); continue; }
      const diff={}; FIELDS.forEach(k=>{ if((p[k]??'')!==(r[k]??'')) diff[k]=r[k]; });
      if(Object.keys(diff).length) local.edits[r.id]=diff;
    }
    published.rows.forEach(p=>{ if(!seen.has(p.id)) local.deleted.push(p.id); });
    saveLocal(); fillFilters(); render(); toast('読み込みました');
  }catch(err){ toast('読み込めませんでした: ' + err.message); }
};
$('bPrint').onclick = ()=>{ if(editMode) $('bEdit').click(); setTimeout(()=>window.print(),50); };

/* ---------- PDF ---------- */
function pdfTable(items){
  return `<table><colgroup><col style="width:78px"><col style="width:108px"><col style="width:78px"><col style="width:84px"><col><col style="width:84px"><col style="width:36px"><col style="width:170px"></colgroup>
  <thead><tr><th>発売日</th><th>メーカー</th><th>カテゴリ</th><th>ブランド</th><th>商品名</th><th>価格(税込)</th><th>確度</th><th>備考</th></tr></thead><tbody>${items.join('')}</tbody></table>`;
}
function pdfRow(r){
  const lim = r.limit ? (/法人/.test(r.limit) ? `<span class="corp">🏢${esc(r.limit)}</span>` : `<span class="lim">${esc(r.limit)}</span>`) : '';
  return `<tr><td class="date">${esc(fmtDate(r))}</td><td>${esc(r.maker)}</td><td>${esc(r.cat)}</td><td>${esc(r.brand)}</td><td>${esc(r.name)} ${lim}</td><td class="price">${esc(r.price)}</td><td class="c-${esc(r.conf)}" style="text-align:center">${esc(r.conf)}</td><td class="note">${esc(r.note)}</td></tr>`;
}
async function makePdf(){
  if(!window.html2canvas || !window.jspdf){ toast('PDFライブラリを読み込み中です。少し待ってからもう一度押してください'); return; }
  const rows = filtered();
  if(!rows.length){ toast('出力する行がありません'); return; }
  const btn=$('bPdf'); btn.disabled=true; const label=btn.textContent;
  const stage=$('pdfStage'); stage.innerHTML='';
  try{
    // 1) 全行を同じ幅で並べて高さを測る
    let cur=null; const items=[];
    for(const r of rows){
      const ym = r.ym || (r.date||'').slice(0,7);
      if(ym!==cur){ cur=ym; items.push({html:`<tr class="month"><td colspan="8">${monthLabel(ym)}</td></tr>`, month:true}); }
      items.push({html:pdfRow(r)});
    }
    const probe=document.createElement('div'); probe.className='page'; probe.style.height='auto';
    probe.innerHTML = pdfTable(items.map(i=>i.html)); stage.append(probe);
    const trs=[...probe.querySelectorAll('tbody tr')];
    trs.forEach((tr,i)=>items[i].h=tr.getBoundingClientRect().height);
    const thH = probe.querySelector('thead').getBoundingClientRect().height;
    const first = 52, avail = 794 - 52 - 22 - thH;   // 余白・ページ番号・見出し分を除く
    // 2) ページ分割（月見出しが単独でページ末尾に残らないようにする）
    const pages=[[]]; let used=first;
    items.forEach((it,i)=>{
      const need = it.h + (it.month && items[i+1] ? items[i+1].h : 0);
      if(used + need > avail && pages[pages.length-1].length){ pages.push([]); used=0; }
      pages[pages.length-1].push(it.html); used += it.h;
    });
    // 3) 1ページずつ画像化してPDFへ
    const {jsPDF}=window.jspdf; const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
    const title=`新商品発売スケジュール`;
    const f=[]; if($('fMonth').value) f.push($('fMonth').selectedOptions[0].text); if($('fCat').value) f.push($('fCat').value); if($('fBrand').value) f.push($('fBrand').value); if($('q').value) f.push('検索:'+$('q').value);
    for(let i=0;i<pages.length;i++){
      btn.textContent=`作成中… ${i+1}/${pages.length}`;
      stage.innerHTML='';
      const pg=document.createElement('div'); pg.className='page';
      pg.innerHTML = (i===0 ? `<h2>${title}</h2><div class="meta">データ更新: ${esc(published.updated)} ／ 出力: ${new Date().toLocaleString('ja-JP')} ／ ${rows.length}件${f.length?' ／ 絞り込み: '+esc(f.join(' / ')):''} ／ ◎公式確認 ○報道等 △予想・要確認</div>` : '') + pdfTable(pages[i]) + `<div class="pn">${i+1} / ${pages.length}</div>`;
      stage.append(pg);
      const canvas = await html2canvas(pg,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});
      if(i>0) pdf.addPage();
      pdf.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',0,0,297,210);
      await new Promise(r=>setTimeout(r,0));
    }
    pdf.save(`新商品発売スケジュール_${stamp()}.pdf`);
    toast(`PDFを作成しました（${pages.length}ページ）`);
  }catch(err){ console.error(err); toast('PDF作成に失敗しました: ' + err.message); }
  finally{ stage.innerHTML=''; btn.disabled=false; btn.textContent=label; }
}
$('bPdf').onclick = makePdf;

/* ---------- 起動 ---------- */
(async function init(){
  try{
    const res = await fetch('data.json?t=' + Date.now());
    published = await res.json();
  }catch(e){ toast('data.json を読み込めませんでした'); }
  $('notes').innerHTML = (published.notes||[]).map(n=>`<li>${esc(n)}</li>`).join('');
  fillFilters(); render();
})();
</script>
</body>
</html>
