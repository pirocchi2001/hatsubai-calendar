name: バンダイ公式カレンダーを更新
on:
  schedule:
    - cron: '0 21 * * 2,4'   # 水・金 06:00 JST (UTC火・木 21:00)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update_bandai.py
      - name: コミット
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "データ自動更新（バンダイ公式カレンダー）" && git push
